name: Linux and macOS packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux-macos-packages.yml'
      - '.github/workflows/xmpp-native.yml'
      - 'build/**'
      - 'src/**'
      - 'tests/Hisa.Services.Tests/**'

permissions:
  contents: read

jobs:
  xmpp-native:
    uses: ./.github/workflows/xmpp-native.yml
    with:
      upload-artifacts: true

  package:
    name: Package HISA (${{ matrix.runtime }})
    needs: xmpp-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: linux-x64, platform: linux, library: libhisa-strophe.so }
          - { runtime: linux-arm64, platform: linux, library: libhisa-strophe.so }
          - { runtime: linux-musl-x64, platform: linux, library: libhisa-strophe.so }
          - { runtime: osx-x64, platform: macos, library: libhisa-strophe.dylib }
          - { runtime: osx-arm64, platform: macos, library: libhisa-strophe.dylib }
    env:
      HISA_RUNTIME: ${{ matrix.runtime }}
      HISA_PLATFORM: ${{ matrix.platform }}
      HISA_NATIVE_LIBRARY: ${{ matrix.library }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: build/xmpp-native/${{ matrix.runtime }}
      - name: Publish package
        shell: pwsh
        run: |
          & "./build/publish-$env:HISA_PLATFORM.ps1" -Runtimes $env:HISA_RUNTIME
      - name: Verify archive
        id: archive
        shell: bash
        run: |
          shopt -s nullglob
          archives=("build/releases/$HISA_PLATFORM/$HISA_RUNTIME"/HISA-"$HISA_RUNTIME"-v*.tar.gz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected one HISA archive for $HISA_RUNTIME."
            exit 1
          fi
          extracted="$(mktemp -d)"
          tar -xzf "${archives[0]}" -C "$extracted"
          test -s "$extracted/HISA"
          test -x "$extracted/HISA"
          for file in "$HISA_NATIVE_LIBRARY" libstrophe-LICENSE.txt openssl-LICENSE.txt expat-LICENSE.txt; do
            test -s "$extracted/XmppNative/$file"
            cmp "build/xmpp-native/$HISA_RUNTIME/$file" "$extracted/XmppNative/$file"
          done
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HISA-${{ matrix.runtime }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
