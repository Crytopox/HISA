name: XMPP native transport

on:
  workflow_call:
    inputs:
      upload-artifacts:
        type: boolean
        default: false
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/xmpp-native.yml'
      - 'build/xmpp/**'
      - 'src/Hisa.Core/**'
      - 'src/Hisa.Data/**'
      - 'src/Hisa.Services/Xmpp/**'
      - 'tests/Hisa.Services.Tests/**'

permissions:
  contents: read

jobs:
  xmpp-native:
    name: Build and smoke test libstrophe (${{ matrix.runtime }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: win-x64, runner: windows-2025 }
          - { runtime: linux-x64, runner: ubuntu-24.04 }
          - { runtime: linux-arm64, runner: ubuntu-24.04-arm }
          - { runtime: linux-musl-x64, runner: ubuntu-24.04 }
          - { runtime: osx-x64, runner: macos-15-intel }
          - { runtime: osx-arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        if: matrix.runtime == 'win-x64'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make perl python curl diffutils
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
      - name: Build for Windows
        if: matrix.runtime == 'win-x64'
        shell: msys2 {0}
        run: bash build/xmpp/build-native.sh win-x64
      - name: Build for Linux (glibc)
        if: matrix.runtime == 'linux-x64' || matrix.runtime == 'linux-arm64'
        shell: bash
        env:
          XMPP_RUNTIME: ${{ matrix.runtime }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ubuntu:22.04 bash -euc '
            apt-get update -qq
            apt-get install -y -qq build-essential ca-certificates curl perl pkg-config python3
            bash build/xmpp/build-native.sh "$1"
          ' bash "$XMPP_RUNTIME"
      - name: Build for Linux (musl)
        if: matrix.runtime == 'linux-musl-x64'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo alpine:3.22 sh -euc '
            apk add --no-cache bash build-base binutils ca-certificates curl perl pkgconf python3 linux-headers
            bash build/xmpp/build-native.sh linux-musl-x64
          '
      - name: Build for macOS
        if: startsWith(matrix.runtime, 'osx-')
        shell: bash
        env:
          XMPP_RUNTIME: ${{ matrix.runtime }}
        run: |
          brew install pkgconf
          export MACOSX_DEPLOYMENT_TARGET=12.0
          bash build/xmpp/build-native.sh "$XMPP_RUNTIME"
      - uses: actions/setup-dotnet@v5
        if: matrix.runtime != 'linux-musl-x64'
        with:
          dotnet-version: "10.0.x"
      - name: Test packaged XMPP transport
        if: matrix.runtime != 'linux-musl-x64'
        env:
          HISA_TEST_XMPP_NATIVE: '1'
          XMPP_RUNTIME: ${{ matrix.runtime }}
        shell: pwsh
        run: dotnet test tests/Hisa.Services.Tests -p:XmppNativeTestRuntime=$env:XMPP_RUNTIME --filter FullyQualifiedName~XmppNativeTests
      - name: Test packaged XMPP transport (musl)
        if: matrix.runtime == 'linux-musl-x64'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e HISA_TEST_XMPP_NATIVE=1 mcr.microsoft.com/dotnet/sdk:10.0-alpine \
            dotnet test tests/Hisa.Services.Tests -p:XmppNativeTestRuntime=linux-musl-x64 --filter FullyQualifiedName~XmppNativeTests
      - uses: actions/upload-artifact@v4
        if: inputs.upload-artifacts
        with:
          name: ${{ matrix.runtime }}
          path: build/xmpp-native/${{ matrix.runtime }}
          if-no-files-found: error
