name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set release metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath "src/Hisa.App/Hisa.App.csproj"
          $version = $project.SelectSingleNode("/Project/PropertyGroup/Version").InnerText.Trim()
          $releaseTag = "v$version"
          $releaseTarget = git rev-parse HEAD

          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TARGET=$releaseTarget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore dependencies
        run: dotnet restore HISA.slnx

      - name: Build solution
        run: dotnet build HISA.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test HISA.slnx --configuration Release --no-build --no-restore

      - name: Publish Windows package
        shell: pwsh
        run: ./build/publish-windows.ps1

      - name: Publish Linux packages
        shell: pwsh
        run: ./build/publish-linux.ps1

      - name: Generate checksums
        shell: bash
        run: |
          find build/releases -type f \( -name "*.zip" -o -name "*.tar.gz" \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > build/releases/SHA256SUMS.txt

      - name: Attest release packages
        uses: actions/attest@v4
        with:
          subject-checksums: build/releases/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            build/releases/windows/win-x64/*.zip \
            build/releases/linux/*/*.tar.gz \
            build/releases/SHA256SUMS.txt \
            --target "${RELEASE_TARGET}" \
            --generate-notes
